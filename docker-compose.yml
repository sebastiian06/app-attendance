# docker-compose.yml
version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: app_attendance_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-app_attendance}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Backend API
  api:
    build: ./back
    container_name: app_attendance_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongo:27017/${MONGO_DB:-app_attendance}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      QR_DEFAULT_TTL_MINUTES: ${QR_DEFAULT_TTL_MINUTES:-10}
      ROOM_CODE_TTL_SECONDS: ${ROOM_CODE_TTL_SECONDS:-90}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./back:/app
      - /app/node_modules
    networks:
      - app_network
    command: npm run dev

  # Frontend (opcional - para servir la app web)
  app:
    build: ./app
    container_name: app_attendance_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local